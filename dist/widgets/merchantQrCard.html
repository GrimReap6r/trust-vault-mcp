<!--
  merchantQrCard.html
  ====================
  MCP App UI resource for generate_merchant_qr (registered under
  ui://trust-vault/merchant-qr-card-v2 in registerMerchantQrApp.ts).

  v6: copyLinkBtn now copies checkoutPageUrl (a real https:// landing page,
  see checkoutPage.ts) instead of the bare transactionRequestUrl solana:
  URI, which does nothing useful pasted outside a wallet app or QR scanner.

  v5: showReceipt() no longer reads row.receipt_url / row.receiptUrl --
  that column is never populated by the settlement bot (confirmed against
  a live Supabase row: receipt_url was null even on a successful payout).
  page.tsx doesn't read that column either -- it builds the receipt link
  itself from the receipt row's own `id` once the Realtime INSERT fires
  (`/receipts/${receiptId}`), same pattern the Discord bot's
  sendReceiptNotification() already uses
  (`${NEXT_PUBLIC_APP_URL}/receipts/${receiptId}`). We now do the same:
  generate_merchant_qr's structuredContent must include `publicBaseUrl`
  (see merchantQr.ts), and we combine that with row.id at receipt time.

  CORRECTED: earlier drafts of this file read `window.mcpApp` directly as a
  host-injected global. That was wrong -- there is no such documented
  global in the MCP Apps spec. The real client-side integration is the
  `App` class from the `@modelcontextprotocol/ext-apps` package (the same
  package used server-side in registerMerchantQrApp.ts), imported here via
  its ESM CDN build. You register handlers (ontoolresult, etc.) BEFORE
  calling app.connect() -- the SDK buffers the initial tool result so it
  isn't missed during the handshake, per the official quickstart. This is
  the pattern the reference examples and (almost certainly) working
  third-party widgets like PayBox actually use.
-->
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: #f2f2f2;
      }
      .card {
        max-width: 380px;
        margin: 0 auto;
        background: #17181c;
        border: 1px solid #2a2b31;
        border-radius: 16px;
        padding: 20px;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .brand {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.2px;
      }
      .status-pill {
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: #3a2f0f;
        color: #f5c542;
      }
      .status-pill[data-state="success"] {
        background: #0f3a1c;
        color: #4ade80;
      }
      .status-pill[data-state="unknown"] {
        background: #3a1414;
        color: #f87171;
      }
      .qr-wrap {
        display: flex;
        justify-content: center;
        background: #ffffff;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .qr-wrap img {
        width: 220px;
        height: 220px;
        display: block;
      }
      .amount {
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .subamount {
        text-align: center;
        font-size: 13px;
        color: #9a9ba3;
        margin-bottom: 18px;
      }
      .details {
        border-top: 1px solid #2a2b31;
        padding-top: 14px;
        display: grid;
        grid-template-columns: auto 1fr;
        row-gap: 8px;
        column-gap: 16px;
        font-size: 13px;
      }
      .details dt {
        color: #9a9ba3;
      }
      .details dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        flex: 1;
        border: 1px solid #2a2b31;
        background: #1f2025;
        color: #f2f2f2;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #26272d;
      }
      .receipt-link {
        display: block;
        width: 100%;
        text-align: center;
        margin-top: 14px;
        font-size: 12px;
        color: #7aa2f7;
        text-decoration: none;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .receipt-link:hover {
        text-decoration: underline;
        background: none;
      }
      .receipt-link[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <span class="brand">Trust Vault</span>
        <span class="status-pill" id="statusPill" data-state="pending"
          >Waiting for payment…</span
        >
      </div>

      <div class="qr-wrap">
        <img id="qrImage" alt="Scan to pay" />
      </div>

      <div class="amount" id="amountLabel">—</div>
      <div class="subamount" id="tokenLabel">—</div>

      <dl class="details">
        <dt>Beneficiary</dt>
        <dd id="beneficiary">—</dd>
        <dt>Bank</dt>
        <dd id="bank">—</dd>
        <dt>Account</dt>
        <dd id="account">—</dd>
        <dt>Order</dt>
        <dd id="order">—</dd>
      </dl>

      <div class="actions">
        <button id="copyLinkBtn" type="button">Copy pay link</button>
        <button id="refreshBtn" type="button">Check now</button>
      </div>

      <button class="receipt-link" id="receiptLink" type="button" hidden>
        View full receipt →
      </button>
    </div>

    <script type="module">
      // The real, documented client SDK -- a static import, resolved before
      // this module's body runs (unlike a dynamic `await import(...)`,
      // which only blocks at the point it's called). If this fails, you'll
      // get a clear network/parse error in the console instead of a
      // confusing "window.X is undefined" a few lines later.
      import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps/+esm";

      const app = new App({
        name: "trust-vault-merchant-qr-card",
        version: "1.0.0",
      });

      let supabase = null;
      let channel = null;

      async function ensureSupabase() {
        if (supabase) return supabase;
        const { createClient } =
          await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
        const state = window.__qrState;
        if (state?.supabaseUrl && state?.supabaseAnonKey) {
          supabase = createClient(state.supabaseUrl, state.supabaseAnonKey);
        }
        return supabase;
      }

      function setStatus(state, label) {
        const pill = document.getElementById("statusPill");
        pill.dataset.state = state;
        pill.textContent = label;
      }

      function render(data) {
        if (!data || !data.found) return;

        document.getElementById("qrImage").src = data.qrCodeDataUri ?? "";
        document.getElementById("amountLabel").textContent =
          `${data.currency ?? "₦"}${data.fiatAmount ?? ""}`;
        document.getElementById("tokenLabel").textContent = data.tokenAmount
          ? `≈ ${Number(data.tokenAmount).toFixed(4)} token`
          : "";
        document.getElementById("beneficiary").textContent =
          data.payoutDetails?.beneficiaryName ?? "—";
        document.getElementById("bank").textContent =
          data.payoutDetails?.bankName ?? "—";
        document.getElementById("account").textContent =
          data.payoutDetails?.accountNumber ?? "—";
        document.getElementById("order").textContent = data.orderAddress
          ? `${data.orderAddress.slice(0, 4)}…${data.orderAddress.slice(-4)}`
          : "—";

        window.__qrState = data;
        subscribeToReceipt(data.orderAddress);
        resolveSigner();
      }

      async function resolveSigner() {
        const state = window.__qrState;
        if (!state?.reference || state.signerAddress) return;
        try {
          const response = await app.callServerTool({
            name: "resolve_reservation_signer",
            arguments: { reference: state.reference },
          });
          const signer = response?.structuredContent?.signer;
          if (signer) state.signerAddress = signer;
        } catch (err) {
          console.warn("resolve_reservation_signer failed", err);
        }
      }

      function showReceipt(row) {
        setStatus("success", "✅ Paid");
        const link = document.getElementById("receiptLink");

        // Build the receipt URL the same way page.tsx and the Discord bot
        // do -- from the receipt row's own `id`, not a stored receipt_url
        // column (that column is never written by the settlement bot, so
        // it's always null; verified against a real successful payout row).
        const base = window.__qrState?.publicBaseUrl;
        if (base && row?.id) {
          link.dataset.receiptUrl = `${base.replace(/\/$/, "")}/receipts/${row.id}`;
          link.hidden = false;
        } else {
          console.warn(
            "Could not build receipt link — missing publicBaseUrl on structuredContent or row.id",
            { base, rowId: row?.id },
          );
        }

        if (channel) supabase.removeChannel(channel);
      }

      async function subscribeToReceipt(trustExpressAddress) {
        if (!trustExpressAddress || channel) return;

        const client = await ensureSupabase();
        if (!client) return;

        channel = client
          .channel(`receipt-insert-${trustExpressAddress}`)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "receipts",
              filter: `trust_express_address=eq.${trustExpressAddress}`,
            },
            (payload) => {
              const state = window.__qrState;
              const amountMatches =
                Number(payload.new?.fiat_amount) ===
                  Number(state?.fiatAmount) &&
                payload.new?.currency === state?.currency;
              if (!amountMatches) return;
              showReceipt(payload.new);
            },
          )
          .subscribe();
      }

      // Register handlers BEFORE app.connect() -- per the SDK's own
      // quickstart: "Set before app.connect() to avoid missing the initial
      // tool result." The host delivers generate_merchant_qr's
      // structuredContent here once the tool call completes server-side.
      app.ontoolresult = (result) => {
        render(result.structuredContent);
      };

      document
        .getElementById("refreshBtn")
        .addEventListener("click", async () => {
          const state = window.__qrState;
          if (!state?.orderAddress) return;
          try {
            const response = await app.callServerTool({
              name: "get_receipt_by_order",
              arguments: {
                orderAddress: state.orderAddress,
                fiatAmount: state.fiatAmount,
                currency: state.currency,
                signerAddress: state.signerAddress, // may be undefined early on -- fine, falls back to the old loose match
              },
            });
            const receiptCheck = response?.structuredContent;
            if (receiptCheck?.found) showReceipt(receiptCheck.receipt);
          } catch (err) {
            console.warn("manual receipt check failed", err);
          }
        });

      document
        .getElementById("receiptLink")
        .addEventListener("click", async () => {
          const btn = document.getElementById("receiptLink");
          const url = btn.dataset.receiptUrl;
          if (!url) return;

          // Feature-detect: openLinks is a host capability (see
          // specification/2026-01-26/apps.mdx), not something this widget
          // can request via _meta.ui.permissions. Older/other hosts may not
          // support it at all.
          if (!app.getHostCapabilities()?.openLinks) {
            await navigator.clipboard.writeText(url);
            btn.textContent = "Host can't open links — link copied instead";
            return;
          }

          const original = btn.textContent;
          try {
            const { isError } = await app.openLink({ url });
            if (isError) {
              // Host declined (blocked domain, user cancelled, etc.) --
              // per app.ts's own JSDoc, fall back to copyable text rather
              // than silently failing.
              await navigator.clipboard.writeText(url);
              btn.textContent = "Couldn't open — link copied instead";
              setTimeout(() => (btn.textContent = original), 2000);
            }
          } catch (err) {
            console.warn("openLink failed", err);
            await navigator.clipboard.writeText(url);
            btn.textContent = "Couldn't open — link copied instead";
            setTimeout(() => (btn.textContent = original), 2000);
          }
        });

      document
        .getElementById("copyLinkBtn")
        .addEventListener("click", async () => {
          // Was: window.__qrState?.transactionRequestUrl (a bare solana: URI --
          // does nothing useful when pasted outside a wallet app or QR scanner).
          // Now: the real https:// landing page from checkoutPage.ts.
          const url = window.__qrState?.checkoutPageUrl;
          if (!url) return;
          await navigator.clipboard.writeText(url);
          const btn = document.getElementById("copyLinkBtn");
          const original = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = original), 1200);
        });

      await app.connect();
    </script>
  </body>
</html>
